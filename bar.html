<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <title>YouTube Overlay</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="designs.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--text);
      font: 13px var(--font);
      overflow: hidden;
      user-select: none;
    }

    /* Goldener Rahmen rund um das ganze Overlay (sichtbar im Rand um das Video) */
    body::after {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      border: 1px solid var(--gold);
      box-shadow:
        inset 0 0 0 1px var(--ink),
        inset 0 0 0 2px var(--gold-dark),
        inset 0 0 0 4px var(--ink);
      z-index: 10;
    }

    #bar {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 0 8px 1px;
      background:
        radial-gradient(ellipse at 50% -40%, color-mix(in srgb, var(--gold-light) 10%, transparent), transparent 70%),
        linear-gradient(180deg, var(--stone-1), var(--stone-2));
      -webkit-app-region: drag; /* Fenster an der Leiste verschieben */
    }
    /* ---------- Tab-Leiste ---------- */
    #tabs {
      position: relative;
      height: 28px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 0 8px;
      background: linear-gradient(180deg, var(--field), var(--ink));
      overflow: hidden;
      -webkit-app-region: drag;
    }
    #tabs > * { -webkit-app-region: no-drag; }
    #tabList { display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
    .tab {
      position: relative;
      display: flex; align-items: center; gap: 6px;
      height: 24px; min-width: 34px; max-width: 170px; flex: 0 1 170px;
      padding: 0 6px 0 8px;
      background: linear-gradient(180deg, var(--tab-1), var(--tab-2));
      border: 1px solid var(--gold-dark); border-bottom: none;
      border-radius: 5px 5px 0 0;
      color: var(--muted); font-size: 12px;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); background: linear-gradient(180deg, var(--tab-h1), var(--tab-h2)); }
    .tab.active {
      color: var(--gold-light);
      border-color: var(--gold);
      background: linear-gradient(180deg, var(--tab-a1), var(--stone-2));
      box-shadow: 0 -2px 8px color-mix(in srgb, var(--gold) 25%, transparent);
    }
    .tab.active::before {
      content: ""; position: absolute; left: 6px; right: 6px; top: -1px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    }
    .tab .ico { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
    .tab .ico img { width: 14px; height: 14px; }
    .tab .ico svg { width: 14px; height: 14px; }
    .tab .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab.youtube { flex: 0 0 auto; max-width: none; }
    .tab .x {
      width: 16px; height: 16px; flex: none; border-radius: 3px;
      display: grid; place-items: center; color: var(--muted);
    }
    .tab .x svg { width: 9px; height: 9px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }
    .tab .x:hover { background: var(--danger); color: var(--on-color); }
    .spinner {
      width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid var(--gold-dark); border-top-color: var(--gold-light);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #btnNewTab { width: 24px; height: 22px; margin-bottom: 1px; }
    #tabs .fill { flex: 1; align-self: stretch; -webkit-app-region: drag; }
    /* Schmale Fenster: nur Symbole in den Tabs */
    @media (max-width: 400px) { .tab .title { display: none; } .tab { flex: 0 0 auto; } }

    /* ---------- Mini-Leiste (minimiert, bleibt über WoW) ---------- */
    #mini { display: none; }
    body.mini #bar, body.mini #tabs { display: none; }
    body.mini #mini {
      height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px;
      background:
        radial-gradient(ellipse at 50% -40%, color-mix(in srgb, var(--gold-light) 12%, transparent), transparent 70%),
        linear-gradient(180deg, var(--stone-1), var(--stone-2));
      -webkit-app-region: drag;
    }
    #mini > button { -webkit-app-region: no-drag; }
    #miniTitle {
      flex: 1; min-width: 0; font-size: 12px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px;
    }
    #miniTitle.paused { color: var(--muted); font-style: italic; }

    /* Goldene Zierlinie unter der Leiste */
    #bar::after {
      content: "";
      position: absolute; left: 4px; right: 4px; bottom: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-dark) 8%, var(--gold-light) 50%, var(--gold-dark) 92%, transparent);
    }
    #bar > * { -webkit-app-region: no-drag; }
    #bar > .drag { -webkit-app-region: drag; }

    /* Emblem: rotes Abspiel-Zeichen in goldener Raute */
    .emblem {
      width: 22px; height: 22px; flex: none; margin: 0 4px 0 2px;
      display: grid; place-items: center;
    }
    .emblem svg { width: 22px; height: 22px; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--gold) 35%, transparent)); }

    button {
      display: grid; place-items: center; flex: none;
      width: 26px; height: 26px; padding: 0;
      background: linear-gradient(180deg, var(--btn-1), var(--btn-2));
      border: 1px solid var(--gold-dark);
      border-radius: 3px;
      color: var(--gold);
      cursor: pointer;
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gold-light) 15%, transparent), 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: border-color .12s, color .12s, box-shadow .12s;
    }
    button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    button:hover {
      color: var(--gold-light);
      border-color: var(--gold);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gold-light) 25%, transparent), 0 0 6px color-mix(in srgb, var(--gold) 45%, transparent);
    }
    button:active { background: linear-gradient(180deg, var(--btn-2), var(--btn-active)); }
    button:disabled { color: var(--disabled); border-color: var(--disabled-border); box-shadow: none; cursor: default; }
    button.on {
      color: var(--on-color);
      border-color: var(--gold-light);
      background: linear-gradient(180deg, var(--red-light), var(--red));
      box-shadow: 0 0 8px color-mix(in srgb, var(--red-light) 55%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    button.close:hover {
      color: var(--on-color);
      background: linear-gradient(180deg, var(--danger-light), var(--danger));
      box-shadow: 0 0 8px color-mix(in srgb, var(--danger-light) 55%, transparent);
    }
    .sep { width: 1px; height: 20px; margin: 0 3px; flex: none; background: linear-gradient(180deg, transparent, var(--gold-dark), transparent); }

    form { flex: 1 1 auto; min-width: 60px; display: flex; margin: 0 3px; }
    input[type=text] {
      flex: 1; min-width: 0; height: 24px;
      border: 1px solid var(--gold-dark); border-radius: 3px;
      background: var(--field); color: var(--text);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
      padding: 0 8px; font: inherit; font-size: 12px; outline: none;
    }
    input[type=text]::placeholder { color: var(--muted); font-style: italic; }
    input[type=text]:focus { border-color: var(--gold); box-shadow: inset 0 2px 4px rgba(0,0,0,.8), 0 0 6px color-mix(in srgb, var(--gold) 40%, transparent); }

    .opacity { display: flex; align-items: center; gap: 5px; color: var(--gold); flex: none; margin: 0 2px; }
    .opacity svg { width: 14px; height: 14px; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 72px; height: 6px; border-radius: 3px; margin: 0;
      background: var(--field); border: 1px solid var(--gold-dark);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 10px; height: 14px; border-radius: 2px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
      border: 1px solid var(--ink);
      box-shadow: 0 0 4px color-mix(in srgb, var(--gold) 60%, transparent);
    }
    .drag { width: 6px; align-self: stretch; flex: none; }

    /* Hinweise liegen über der Leiste (darunter ist das YouTube-Bild) – Klick schließt sie */
    #status {
      position: fixed; left: 36px; right: 8px; top: 5px; height: 25px; line-height: 23px;
      background: linear-gradient(180deg, var(--status-1), var(--status-2));
      color: var(--gold-light); border: 1px solid var(--gold-dark); border-radius: 3px; padding: 0 10px;
      display: none; font-size: 12px; cursor: pointer; z-index: 5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      -webkit-app-region: no-drag;
    }
    /* Schmale Fenster (z. B. Shorts hochkant): Unwichtiges ausblenden */
    @media (max-width: 520px) { .opacity, #btnHome, #btnReload, .sep { display: none; } }
    @media (max-width: 400px) { #btnBack, .emblem { display: none; } }
    /* Dauerhafter Hinweis im Durchklick-Modus (Leiste ist dann nicht klickbar) */
    #status.sticky { background: linear-gradient(180deg, var(--status-1), var(--status-2)); border-color: var(--danger-light); left: 6px; text-align: center; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="emblem" title="YouTube Overlay">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" style="fill:var(--btn-2);stroke:var(--gold)" stroke-width="1.5"/>
        <path d="M12 4.5 19.5 12 12 19.5 4.5 12Z" fill="none" style="stroke:var(--gold-dark)" stroke-width="0.8"/>
        <path d="M10 8.3v7.4l6-3.7Z" style="fill:var(--emblem-play)"/>
      </svg>
    </div>
    <button id="btnBack" title="Zurück" disabled>
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button id="btnHome" title="YouTube-Startseite">
      <svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 2.5l5.5 5M4 6.5V13h3v-3h2v3h3V6.5"/></svg>
    </button>
    <button id="btnReload" title="Neu laden">
      <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
    </button>
    <form id="urlForm">
      <input id="url" type="text" spellcheck="false" placeholder="YouTube-Link einfügen oder suchen …">
    </form>
    <div class="opacity" title="Deckkraft">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11Z" fill="currentColor"/></svg>
      <input id="opacity" type="range" min="20" max="100" step="5">
    </div>
    <div class="sep"></div>
    <button id="btnShorts" title="YouTube Shorts (Fenster wird hochkant)">
      <svg viewBox="0 0 16 16"><rect x="4" y="1.8" width="8" height="12.4" rx="1.6"/><path d="M7 6v4l3-2Z" fill="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="btnCinema" title="Kino-Modus: Video füllt das Overlay">
      <svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
    </button>
    <button id="btnClick" title="Durchklicken: Maus geht durch das Overlay zu WoW">
      <svg viewBox="0 0 16 16"><path d="M4 2.5v9l2.5-2.3 1.8 4 1.6-.7-1.8-3.9H11.5Z"/></svg>
    </button>
    <button id="btnBar" title="Leiste ausblenden">
      <svg viewBox="0 0 16 16"><path id="barIcon" d="M3.5 10 8 5.5l4.5 4.5"/></svg>
    </button>
    <button id="btnSettings" title="Einstellungen (Werbeblocker, Hotkeys)">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg>
    </button>
    <div class="drag"></div>
    <div class="sep"></div>
    <button id="btnMin" title="Minimieren">
      <svg viewBox="0 0 16 16"><path d="M4 11h8"/></svg>
    </button>
    <button id="btnMax" title="Maximieren">
      <svg viewBox="0 0 16 16"><path id="maxIcon" d="M3.5 3.5h9v9h-9Z"/></svg>
    </button>
    <button id="btnClose" class="close" title="Beenden">
      <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <div id="mini">
    <div class="emblem" title="YouTube Overlay – an der Leiste verschieben">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" style="fill:var(--btn-2);stroke:var(--gold)" stroke-width="1.5"/>
        <path d="M10 8.3v7.4l6-3.7Z" style="fill:var(--emblem-play)"/>
      </svg>
    </div>
    <button id="miniPlay" title="Play / Pause">
      <svg viewBox="0 0 16 16"><path id="miniPlayIcon" d="M5 3.5v9l7-4.5Z"/></svg>
    </button>
    <div id="miniTitle">YouTube</div>
    <button id="miniRestore" title="Wiederherstellen">
      <svg viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9ZM3.5 6h9"/></svg>
    </button>
    <button id="miniClose" class="close" title="Beenden">
      <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <div id="tabs">
    <div id="tabList"></div>
    <button id="btnNewTab" title="Neuer Tab (Strg+T)">
      <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>
    </button>
    <div class="fill"></div>
  </div>
  <div id="status"></div>
  <script src="keys.js"></script>
  <script src="bar.js"></script>
</body>
</html>
