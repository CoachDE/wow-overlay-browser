<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <title>YouTube Overlay</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="designs.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--text);
      font: 13px var(--font);
      overflow: hidden;
      user-select: none;
    }

    /* Goldener Rahmen rund um das ganze Overlay (sichtbar im Rand um das Video) */
    body::after {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      border: 1px solid var(--gold);
      box-shadow:
        inset 0 0 0 1px var(--ink),
        inset 0 0 0 2px var(--gold-dark),
        inset 0 0 0 4px var(--ink);
      z-index: 10;
    }

    #bar {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 0 8px 1px;
      background:
        radial-gradient(ellipse at 50% -40%, color-mix(in srgb, var(--gold-light) 10%, transparent), transparent 70%),
        linear-gradient(180deg, var(--stone-1), var(--stone-2));
      -webkit-app-region: drag; /* Fenster an der Leiste verschieben */
    }
    /* ---------- Tab-Leiste ---------- */
    #tabs {
      position: relative;
      height: 28px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 0 8px;
      background: linear-gradient(180deg, var(--field), var(--ink));
      overflow: hidden;
      -webkit-app-region: drag;
    }
    #tabs > * { -webkit-app-region: no-drag; }
    #tabList { display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
    .tab {
      position: relative;
      display: flex; align-items: center; gap: 6px;
      height: 24px; min-width: 34px; max-width: 170px; flex: 0 1 170px;
      padding: 0 6px 0 8px;
      background: linear-gradient(180deg, var(--tab-1), var(--tab-2));
      border: 1px solid var(--gold-dark); border-bottom: none;
      border-radius: 5px 5px 0 0;
      color: var(--muted); font-size: 12px;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); background: linear-gradient(180deg, var(--tab-h1), var(--tab-h2)); }
    .tab.active {
      color: var(--gold-light);
      border-color: var(--gold);
      background: linear-gradient(180deg, var(--tab-a1), var(--stone-2));
      box-shadow: 0 -2px 8px color-mix(in srgb, var(--gold) 25%, transparent);
    }
    .tab.active::before {
      content: ""; position: absolute; left: 6px; right: 6px; top: -1px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    }
    .tab .ico { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
    .tab .ico img { width: 14px; height: 14px; }
    .tab .ico svg { width: 14px; height: 14px; }
    .tab .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab.youtube { flex: 0 0 auto; max-width: none; }
    .tab .x {
      width: 16px; height: 16px; flex: none; border-radius: 3px;
      display: grid; place-items: center; color: var(--muted);
    }
    .tab .x svg { width: 9px; height: 9px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }
    .tab .x:hover { background: var(--danger); color: var(--on-color); }
    .spinner {
      width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid var(--gold-dark); border-top-color: var(--gold-light);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #btnNewTab { width: 24px; height: 22px; margin-bottom: 1px; }
    #tabs .fill { flex: 1; align-self: stretch; -webkit-app-region: drag; }
    /* ---------- Lesezeichen ---------- */
    #btnStar.saved { color: var(--gold-light); }
    #btnStar.saved svg { fill: var(--gold); }
    #bookmarks {
      height: 24px; display: flex; align-items: center; padding: 0 8px;
      background: var(--ink);
      border-top: 1px solid color-mix(in srgb, var(--gold-dark) 50%, transparent);
    }
    #bookmarks[hidden], body.mini #bookmarks { display: none; }
    #bmList {
      display: flex; align-items: center; gap: 3px; min-width: 0; flex: 1;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    }
    #bmList::-webkit-scrollbar { display: none; }
    .bm {
      display: flex; align-items: center; gap: 5px; flex: none;
      height: 19px; max-width: 160px; padding: 0 7px 0 5px;
      border: 1px solid transparent; border-radius: var(--radius);
      color: var(--text); font-size: 11.5px; cursor: pointer;
    }
    .bm:hover { background: color-mix(in srgb, var(--gold) 14%, transparent); border-color: color-mix(in srgb, var(--gold) 35%, transparent); }
    .bm .ico { width: 13px; height: 13px; flex: none; display: grid; place-items: center; color: var(--muted); }
    .bm .ico img, .bm .ico svg { width: 13px; height: 13px; }
    .bm .title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bm.dragging { opacity: .4; }
    .bm.drop-before { box-shadow: -2px 0 0 var(--gold-light); }
    .bm.drop-after { box-shadow: 2px 0 0 var(--gold-light); }
    .bm input {
      width: 120px; height: 17px; font: inherit; font-size: 11.5px; padding: 0 4px;
      background: var(--field); color: var(--text); border: 1px solid var(--gold); border-radius: 2px; outline: none;
    }
    @media (max-width: 400px) { .bm .title { display: none; } .bm { padding: 0 4px; } }

    /* ---------- Tour durch die Leiste ---------- */
    #tour { position: fixed; inset: 0; z-index: 50; -webkit-app-region: no-drag; }
    #tour[hidden] { display: none; }
    #tourRing {
      position: fixed; border-radius: 6px; pointer-events: none;
      border: 2px solid var(--gold-light);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.66), 0 0 14px 2px var(--gold);
      transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease;
    }
    #tourRing.none { border-color: transparent; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.66); }
    #tourBubble {
      position: fixed; width: 310px; padding: 12px 14px 10px;
      background: linear-gradient(180deg, var(--stone-1), var(--stone-2));
      border: 1px solid var(--gold); border-radius: calc(var(--radius) + 3px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.75), 0 0 12px color-mix(in srgb, var(--gold) 35%, transparent);
      color: var(--text); transition: left .25s ease, top .25s ease;
      animation: tourIn .25s ease-out;
    }
    #tourBubble::before {
      content: ""; position: absolute; top: -7px; left: var(--arrow, 50%); width: 12px; height: 12px;
      transform: translateX(-50%) rotate(45deg);
      background: var(--stone-1); border-left: 1px solid var(--gold); border-top: 1px solid var(--gold);
    }
    #tourBubble.center::before { display: none; }
    @keyframes tourIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .tour-title { color: var(--gold-light); font-size: 15px; margin-bottom: 6px; }
    .tour-text { font-size: 12.5px; line-height: 1.45; color: var(--text); }
    .tour-foot { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
    .tour-grow { flex: 1; }
    .tour-count { font-size: 11px; color: var(--muted); min-width: 34px; }
    #tour .tour-btn {
      width: auto; height: 26px; padding: 0 12px; font: 12px var(--font); color: var(--gold);
      border-radius: var(--radius); clip-path: none;
    }
    #tour .tour-btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); padding: 0 6px; }
    #tour .tour-btn.ghost:hover { color: var(--text); background: transparent; box-shadow: none; }
    /* Hauptknopf: dunkle Schrift auf heller Akzentfarbe – in jedem Design gut lesbar */
    #tour .tour-btn.primary,
    #tour .tour-btn.primary:hover {
      color: var(--primary-text); border-color: var(--gold-light); font-weight: 600;
      background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    #tour .tour-btn.primary:hover { box-shadow: 0 0 10px color-mix(in srgb, var(--gold-light) 60%, transparent); }
    .tour-btn[hidden] { display: none; }

    /* Twitch-Knopf in Twitch-Lila, Adressfeld im Twitch-Eingabemodus */
    #btnTwitch svg { stroke: #a970ff; }
    #btnTwitch.on svg { stroke: #fff; }
    #btnTwitch.on { background: linear-gradient(180deg, #a970ff, #6b2fd6); border-color: #d2b8ff; }
    input#url.twitch-mode { border-color: #a970ff; box-shadow: inset 0 2px 4px rgba(0,0,0,.8), 0 0 8px rgba(169, 112, 255, .55); }

    /* ---------- Geteilte Ansicht ---------- */
    #splitDivider {
      position: fixed; z-index: 4; cursor: col-resize;
      background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--gold-dark) 70%, var(--ink)), var(--ink));
      -webkit-app-region: no-drag;
    }
    #splitDivider[hidden] { display: none; }
    #splitDivider span {
      position: absolute; left: 50%; top: 50%; width: 2px; height: 36px; transform: translate(-50%, -50%);
      border-radius: 1px; background: var(--gold); box-shadow: 0 0 6px color-mix(in srgb, var(--gold) 60%, transparent);
    }
    #splitDivider:hover span, #splitDivider.dragging span { background: var(--gold-light); height: 60px; }
    /* Tab, der in der geteilten Ansicht gerade auf der anderen Seite zu sehen ist */
    .tab.pane:not(.active) { color: var(--text); border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
    .tab .side { font-size: 9px; color: var(--gold); margin-left: -2px; }

    /* Rückmeldung beim Hinzufügen/Entfernen */
    #btnStar.pop svg { animation: starPop .55s ease-out; }
    @keyframes starPop {
      0% { transform: scale(1); }
      35% { transform: scale(1.55) rotate(18deg); filter: drop-shadow(0 0 6px var(--gold-light)); }
      100% { transform: scale(1) rotate(0); }
    }
    .bm.bm-new {
      border-color: var(--gold-light);
      animation: bmPulse 1.1s ease-out 2;
    }
    @keyframes bmPulse {
      0% { background: color-mix(in srgb, var(--gold) 55%, transparent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold-light) 80%, transparent); color: #fff; }
      60% { box-shadow: 0 0 10px 3px color-mix(in srgb, var(--gold) 50%, transparent); }
      100% { background: color-mix(in srgb, var(--gold) 12%, transparent); box-shadow: 0 0 0 0 transparent; }
    }
    .bm.bm-removing { animation: bmOut .28s ease-in forwards; pointer-events: none; }
    @keyframes bmOut { to { opacity: 0; transform: scale(.7); } }
    #bookmarks.appear #bmList { animation: barAppear .4s ease-out; }
    @keyframes barAppear { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .fly-star {
      position: fixed; z-index: 30; width: 16px; height: 16px; pointer-events: none;
      color: var(--gold-light); filter: drop-shadow(0 0 5px var(--gold));
      transition: transform .6s cubic-bezier(.45, -0.35, .55, 1.25), opacity .6s ease-in;
    }
    .fly-star svg { width: 16px; height: 16px; fill: var(--gold); stroke: var(--gold-light); stroke-width: 1; }

    /* Update-Knopf rechts in der Tab-Leiste */
    #btnUpdate {
      width: auto; height: 20px; margin: 0 0 3px 6px; padding: 0 9px;
      font: 11px var(--font); white-space: nowrap;
      color: var(--primary-text);
      background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, var(--gold-dark));
      border-color: var(--gold-light);
      box-shadow: 0 0 8px color-mix(in srgb, var(--gold) 60%, transparent);
      animation: updatePulse 2.4s ease-in-out infinite;
    }
    #btnUpdate[hidden] { display: none; }
    #btnUpdate.busy { animation: none; cursor: default; background: var(--btn-2); color: var(--gold-light); }
    #btnUpdate.error { animation: none; background: linear-gradient(180deg, var(--danger-light), var(--danger)); color: var(--on-color); border-color: var(--danger-light); }
    @keyframes updatePulse { 50% { box-shadow: 0 0 2px color-mix(in srgb, var(--gold) 30%, transparent); } }
    /* Schmale Fenster: nur Symbole in den Tabs */
    @media (max-width: 400px) { .tab .title { display: none; } .tab { flex: 0 0 auto; } }

    /* ---------- Mini-Leiste (minimiert, bleibt über WoW) ---------- */
    #mini { display: none; }
    body.mini #bar, body.mini #tabs { display: none; }
    body.mini #mini {
      height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px;
      background:
        radial-gradient(ellipse at 50% -40%, color-mix(in srgb, var(--gold-light) 12%, transparent), transparent 70%),
        linear-gradient(180deg, var(--stone-1), var(--stone-2));
      -webkit-app-region: drag;
    }
    #mini > button { -webkit-app-region: no-drag; }
    #miniTitle {
      flex: 1; min-width: 0; font-size: 12px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px;
    }
    #miniTitle.paused { color: var(--muted); font-style: italic; }

    /* Goldene Zierlinie unter der Leiste */
    #bar::after {
      content: "";
      position: absolute; left: 4px; right: 4px; bottom: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-dark) 8%, var(--gold-light) 50%, var(--gold-dark) 92%, transparent);
    }
    #bar > * { -webkit-app-region: no-drag; }
    #bar > .drag { -webkit-app-region: drag; }

    /* Emblem: rotes Abspiel-Zeichen in goldener Raute */
    .emblem {
      width: 22px; height: 22px; flex: none; margin: 0 4px 0 2px;
      display: grid; place-items: center;
    }
    .emblem svg { width: 22px; height: 22px; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--gold) 35%, transparent)); }

    button {
      display: grid; place-items: center; flex: none;
      width: 26px; height: 26px; padding: 0;
      background: linear-gradient(180deg, var(--btn-1), var(--btn-2));
      border: 1px solid var(--gold-dark);
      border-radius: 3px;
      color: var(--gold);
      cursor: pointer;
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gold-light) 15%, transparent), 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: border-color .12s, color .12s, box-shadow .12s;
    }
    button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    button:hover {
      color: var(--gold-light);
      border-color: var(--gold);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gold-light) 25%, transparent), 0 0 6px color-mix(in srgb, var(--gold) 45%, transparent);
    }
    button:active { background: linear-gradient(180deg, var(--btn-2), var(--btn-active)); }
    button:disabled { color: var(--disabled); border-color: var(--disabled-border); box-shadow: none; cursor: default; }
    button.on {
      color: var(--on-color);
      border-color: var(--gold-light);
      background: linear-gradient(180deg, var(--red-light), var(--red));
      box-shadow: 0 0 8px color-mix(in srgb, var(--red-light) 55%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    button.close:hover {
      color: var(--on-color);
      background: linear-gradient(180deg, var(--danger-light), var(--danger));
      box-shadow: 0 0 8px color-mix(in srgb, var(--danger-light) 55%, transparent);
    }
    .sep { width: 1px; height: 20px; margin: 0 3px; flex: none; background: linear-gradient(180deg, transparent, var(--gold-dark), transparent); }

    form { flex: 1 1 auto; min-width: 60px; display: flex; margin: 0 3px; }
    input[type=text] {
      flex: 1; min-width: 0; height: 24px;
      border: 1px solid var(--gold-dark); border-radius: 3px;
      background: var(--field); color: var(--text);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
      padding: 0 8px; font: inherit; font-size: 12px; outline: none;
    }
    input[type=text]::placeholder { color: var(--muted); font-style: italic; }
    input[type=text]:focus { border-color: var(--gold); box-shadow: inset 0 2px 4px rgba(0,0,0,.8), 0 0 6px color-mix(in srgb, var(--gold) 40%, transparent); }

    .opacity { display: flex; align-items: center; gap: 5px; color: var(--gold); flex: none; margin: 0 2px; }
    .opacity svg { width: 14px; height: 14px; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 72px; height: 6px; border-radius: 3px; margin: 0;
      background: var(--field); border: 1px solid var(--gold-dark);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 10px; height: 14px; border-radius: 2px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
      border: 1px solid var(--ink);
      box-shadow: 0 0 4px color-mix(in srgb, var(--gold) 60%, transparent);
    }
    .drag { width: 6px; align-self: stretch; flex: none; }

    /* Hinweise liegen über der Leiste (darunter ist das YouTube-Bild) – Klick schließt sie */
    #status {
      position: fixed; left: 36px; right: 8px; top: 5px; height: 25px; line-height: 23px;
      background: linear-gradient(180deg, var(--status-1), var(--status-2));
      color: var(--gold-light); border: 1px solid var(--gold-dark); border-radius: 3px; padding: 0 10px;
      display: none; font-size: 12px; cursor: pointer; z-index: 5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      -webkit-app-region: no-drag;
    }
    /* Schmale Fenster (z. B. Shorts hochkant): Unwichtiges ausblenden */
    @media (max-width: 820px) { #volumeValue { display: none; } #volume, input#opacity { width: 52px; } }
    @media (max-width: 760px) { #volume, #volumeValue, #btnHome { display: none; } }
    @media (max-width: 700px) { .opacity, #btnReload { display: none; } }
    @media (max-width: 520px) { .opacity, #btnHome, #btnReload, .sep, #volume, #volumeValue { display: none; } }
    /* Lautstärke */
    .volume { display: flex; align-items: center; gap: 4px; flex: none; margin: 0 2px; }
    #volume { width: 64px; }
    #volumeValue { width: 22px; font-size: 10px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    #btnVol.muted, #miniVol.muted { color: var(--danger-light); }
    @media (max-width: 400px) { #btnBack, .emblem { display: none; } }
    /* Dauerhafter Hinweis im Durchklick-Modus (Leiste ist dann nicht klickbar) */
    #status.sticky { background: linear-gradient(180deg, var(--status-1), var(--status-2)); border-color: var(--danger-light); left: 6px; text-align: center; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="emblem" data-i18n-title="bar.emblem">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" style="fill:var(--btn-2);stroke:var(--gold)" stroke-width="1.5"/>
        <path d="M12 4.5 19.5 12 12 19.5 4.5 12Z" fill="none" style="stroke:var(--gold-dark)" stroke-width="0.8"/>
        <path d="M10 8.3v7.4l6-3.7Z" style="fill:var(--emblem-play)"/>
      </svg>
    </div>
    <button id="btnBack" data-i18n-title="bar.back" disabled>
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button id="btnHome" title="YouTube-Startseite">
      <svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 2.5l5.5 5M4 6.5V13h3v-3h2v3h3V6.5"/></svg>
    </button>
    <button id="btnReload" data-i18n-title="bar.reload">
      <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
    </button>
    <form id="urlForm">
      <input id="url" type="text" spellcheck="false" placeholder="YouTube-Link einfügen oder suchen …">
    </form>
    <button id="btnStar" title="Als Lesezeichen speichern (Strg+D)">
      <svg viewBox="0 0 16 16"><path id="starIcon" d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6Z"/></svg>
    </button>
    <div class="opacity" data-i18n-title="bar.opacity">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11Z" fill="currentColor"/></svg>
      <input id="opacity" type="range" min="20" max="100" step="5">
    </div>
    <div class="volume" id="volumeBox">
      <button id="btnVol" title="Stumm an/aus">
        <svg viewBox="0 0 16 16"><path class="vol-icon" d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5Z"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="100" step="1" data-i18n-title="bar.volumeSlider">
      <span id="volumeValue">100</span>
    </div>
    <div class="sep"></div>
    <button id="btnShorts" title="YouTube Shorts (Fenster wird hochkant)">
      <svg viewBox="0 0 16 16"><rect x="4" y="1.8" width="8" height="12.4" rx="1.6"/><path d="M7 6v4l3-2Z" fill="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="btnCinema" title="Kino-Modus: Video füllt das Overlay">
      <svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
    </button>
    <button id="btnTwitch" title="Twitch-Modus: Stream + Chat nebeneinander">
      <svg viewBox="0 0 16 16"><path d="M3 2h10.5v7l-3 3H8l-2.2 2.2V12H3Z"/><path d="M8 5v3M10.8 5v3"/></svg>
    </button>
    <button id="btnSplit" title="Geteilte Ansicht: zwei Seiten nebeneinander">
      <svg viewBox="0 0 16 16"><rect x="1.8" y="3" width="12.4" height="10" rx="1.2"/><path d="M8 3v10"/></svg>
    </button>
    <button id="btnFocus" title="Fokus-Modus: ohne Maus durchsichtig">
      <svg viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2.2"/><path id="focusSlash" d="M2.5 13.5l11-11"/></svg>
    </button>
    <button id="btnClick" title="Durchklicken: Maus geht durch das Overlay zu WoW">
      <svg viewBox="0 0 16 16"><path d="M4 2.5v9l2.5-2.3 1.8 4 1.6-.7-1.8-3.9H11.5Z"/></svg>
    </button>
    <button id="btnBar" title="Leiste ausblenden">
      <svg viewBox="0 0 16 16"><path id="barIcon" d="M3.5 10 8 5.5l4.5 4.5"/></svg>
    </button>
    <button id="btnSettings" data-i18n-title="bar.settings">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg>
    </button>
    <div class="drag"></div>
    <div class="sep"></div>
    <button id="btnMin" title="Minimieren">
      <svg viewBox="0 0 16 16"><path d="M4 11h8"/></svg>
    </button>
    <button id="btnMax" title="Maximieren">
      <svg viewBox="0 0 16 16"><path id="maxIcon" d="M3.5 3.5h9v9h-9Z"/></svg>
    </button>
    <button id="btnClose" class="close" title="Beenden">
      <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <div id="mini">
    <div class="emblem" data-i18n-title="bar.emblem">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" style="fill:var(--btn-2);stroke:var(--gold)" stroke-width="1.5"/>
        <path d="M10 8.3v7.4l6-3.7Z" style="fill:var(--emblem-play)"/>
      </svg>
    </div>
    <button id="miniPlay" title="Play / Pause">
      <svg viewBox="0 0 16 16"><path id="miniPlayIcon" d="M5 3.5v9l7-4.5Z"/></svg>
    </button>
    <div id="miniTitle">YouTube</div>
    <button id="miniVol" title="Stumm an/aus – Mausrad: Lautstärke">
      <svg viewBox="0 0 16 16"><path class="vol-icon" d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5Z"/></svg>
    </button>
    <button id="miniRestore" title="Wiederherstellen">
      <svg viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9ZM3.5 6h9"/></svg>
    </button>
    <button id="miniClose" class="close" title="Beenden">
      <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <div id="tabs">
    <div id="tabList"></div>
    <button id="btnNewTab">
      <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>
    </button>
    <div class="fill"></div>
    <button id="btnUpdate" hidden></button>
  </div>
  <div id="bookmarks" hidden>
    <div id="bmList"></div>
  </div>
  <div id="splitDivider" hidden data-i18n-title="bar.divider"><span></span></div>
  <div id="status"></div>
  <div id="tour" hidden>
    <div id="tourRing"></div>
    <div id="tourBubble">
      <div class="tour-title" id="tourTitle"></div>
      <div class="tour-text" id="tourText"></div>
      <div class="tour-foot">
        <span class="tour-count" id="tourCount"></span>
        <button class="tour-btn ghost" id="tourSkip"></button>
        <span class="tour-grow"></span>
        <button class="tour-btn" id="tourBack"></button>
        <button class="tour-btn primary" id="tourNext"></button>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="keys.js"></script>
  <script src="bar.js"></script>
</body>
</html>
